[project]
name = "factflow"
version = "0.1.0"
description = "Atomic-fact extraction, cross-run matching, and property annotation for multi-agent traces"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0.0",
    "pydantic>=2.0",
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
sbert = ["sentence-transformers>=2.2"]
dev = ["pytest>=7.0"]

[project.scripts]
factflow = "factflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factflow"]
artifacts = ["src/factflow/*.css", "src/factflow/*.js"]
