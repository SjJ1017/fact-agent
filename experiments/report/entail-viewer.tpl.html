<title>Entailment trace viewer</title>
<style>
:root{--bg:#fbfaf8;--ink:#1c1a17;--dim:#6b6560;--line:#ded8d0;--card:#fff;
 --eq:#2f6f4e;--eqbg:#e8f3ec;--deg:#a5471f;--degbg:#fbeee7;--ent:#7a6a52;--entbg:#f3efe7;
 --sel:#1b4f8a;--selbg:#e6eff8;}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
 --bg:#161513;--ink:#e9e5df;--dim:#9a938b;--line:#332f2a;--card:#1e1c19;
 --eq:#6fbf90;--eqbg:#1b2a21;--deg:#e0895d;--degbg:#2c1f18;--ent:#b7a488;--entbg:#26221b;
 --sel:#7db2ea;--selbg:#16232f;}}
:root[data-theme=dark]{--bg:#161513;--ink:#e9e5df;--dim:#9a938b;--line:#332f2a;--card:#1e1c19;
 --eq:#6fbf90;--eqbg:#1b2a21;--deg:#e0895d;--degbg:#2c1f18;--ent:#b7a488;--entbg:#26221b;
 --sel:#7db2ea;--selbg:#16232f;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);margin:0;
 font:14px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--bg);
 border-bottom:1px solid var(--line);padding:12px 20px}
h1{font-size:15px;margin:0 0 8px;font-weight:600;letter-spacing:.01em}
.bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
select{font:inherit;padding:4px 8px;background:var(--card);color:var(--ink);
 border:1px solid var(--line);border-radius:5px;max-width:min(62vw,620px)}
label{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;color:var(--dim);
 cursor:pointer;white-space:nowrap}
.stat{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.key{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--dim)}
.key i{width:22px;height:0;border-top:2px solid;display:inline-block}
main{padding:18px 20px 60px;position:relative}
#wires{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:1}
.round{margin-bottom:22px}
.rlabel{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);
 margin:0 0 8px}
.turns{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.turn{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;
 position:relative;z-index:2}
.who{font-weight:600;font-size:12.5px;margin-bottom:2px}
.role{font-size:11.5px;color:var(--dim);margin-bottom:9px}
.body{white-space:pre-wrap;font-size:13.5px}
mark{background:none;padding:1px 0;border-bottom:1.5px solid var(--line);cursor:pointer}
mark.eq{border-color:var(--eq)}
mark.strong{background:var(--degbg);border-color:var(--deg)}
mark.weak{background:var(--entbg);border-color:var(--ent);border-bottom-style:dashed}
mark.on{background:var(--selbg);border-color:var(--sel);border-bottom-width:2px}
#tip{position:fixed;z-index:40;max-width:430px;background:var(--card);color:var(--ink);
 border:1px solid var(--line);border-radius:7px;padding:10px 12px;font-size:12.5px;
 box-shadow:0 6px 22px rgba(0,0,0,.14);display:none}
#tip b{font-weight:600}
#tip .row{margin:5px 0 0;padding-top:5px;border-top:1px dashed var(--line)}
#tip .s{color:var(--deg)}#tip .w{color:var(--ent)}
.num{font-variant-numeric:tabular-nums;color:var(--dim)}
.empty{color:var(--dim);font-style:italic}
</style>

<header>
  <h1>Entailment trace viewer</h1>
  <div class="bar">
    <select id="pick"></select>
    <label><input type="checkbox" id="eq"> 等价连线</label>
    <label><input type="checkbox" id="deg" checked> 降级边</label>
    <label><input type="checkbox" id="ent"> 仅强弱不同</label>
    <span class="key"><i style="border-color:var(--eq)"></i>等价</span>
    <span class="key"><i style="border-color:var(--deg)"></i>降级（有投递证据）</span>
    <span class="key"><i style="border-color:var(--ent);border-top-style:dashed"></i>仅强弱不同</span>
    <span class="stat" id="stat"></span>
  </div>
</header>
<main><svg id="wires"></svg><div id="rounds"></div></main>
<div id="tip"></div>

<script>
const DATA = __DATA__;
const $ = s => document.querySelector(s);
const pick = $('#pick'), rounds = $('#rounds'), wires = $('#wires'), tip = $('#tip');
let cur = null, sel = null;

DATA.debates.forEach((d, i) => {
  const o = document.createElement('option');
  o.value = i; o.textContent = d.id;
  pick.append(o);
});

function esc(s){return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function render(i){
  cur = DATA.debates[i]; sel = null;
  const byRound = {};
  cur.order.forEach(slot => {
    const [ag, rd] = slot.split('|');
    (byRound[rd] = byRound[rd] || []).push([ag, slot]);
  });

  // which facts sit on a degradation edge, and on which side
  const strongF = new Set(), weakF = new Set();
  cur.entail.forEach(e => { strongF.add(e.strong_fact); weakF.add(e.weak_fact); });

  rounds.innerHTML = '';
  Object.keys(byRound).sort((a,b)=>a-b).forEach(rd => {
    const sec = document.createElement('section'); sec.className = 'round';
    sec.innerHTML = `<p class="rlabel">round ${rd}</p>`;
    const grid = document.createElement('div'); grid.className = 'turns';
    byRound[rd].forEach(([ag, slot]) => {
      const t = document.createElement('div');
      t.className = 'turn'; t.id = 'slot-' + slot;
      const spans = (cur.spans[slot] || []).slice().sort((a,b)=>a.a-b.a);
      const text = cur.text[slot] || '';
      let html = '', at = 0;
      spans.forEach(sp => {
        if (sp.a < at) return;
        const fids = (sp.fs || []).map(g => g.f);
        let cls = 'eq';
        if (fids.some(f => strongF.has(f))) cls = 'strong';
        else if (fids.some(f => weakF.has(f))) cls = 'weak';
        html += esc(text.slice(at, sp.a));
        html += `<mark class="${cls}" data-fs="${fids.join(' ')}" data-slot="${slot}">`
             +  esc(text.slice(sp.a, sp.b)) + '</mark>';
        at = sp.b;
      });
      html += esc(text.slice(at));
      t.innerHTML = `<div class="who">${ag}</div>`
                  + `<div class="role">${esc(cur.role_short[ag] || '')}</div>`
                  + `<div class="body">${html}</div>`;
      grid.append(t);
    });
    sec.append(grid); rounds.append(sec);
  });

  const nd = cur.entail.filter(e => e.kind === 'degraded').length;
  $('#stat').textContent =
    `${cur.entail.length} 条蕴含边（降级 ${nd}） · ${Object.keys(cur.links||{}).length} 条事实有等价连线`;
  draw();
}

function centre(el){
  const r = el.getBoundingClientRect(), m = document.querySelector('main').getBoundingClientRect();
  return {x: r.left - m.left + r.width/2, y: r.top - m.top + r.height/2};
}
function marksFor(fid, slot){
  return [...document.querySelectorAll(`#slot-${CSS.escape(slot)} mark`)]
    .filter(m => m.dataset.fs.split(' ').includes(fid));
}

function draw(){
  wires.innerHTML = '';
  if (!cur) return;
  const main = document.querySelector('main');
  wires.setAttribute('width', main.scrollWidth);
  wires.setAttribute('height', main.scrollHeight);
  const seg = [];

  if ($('#eq').checked) {
    Object.entries(cur.links || {}).forEach(([fid, edges]) => {
      edges.forEach(e => {
        const A = marksFor(fid, e.from)[0], B = marksFor(fid, e.to)[0];
        if (A && B) seg.push({A, B, c: 'var(--eq)', dash: '', arrow: false});
      });
    });
  }
  cur.entail.forEach(e => {
    const want = e.kind === 'degraded' ? $('#deg').checked : $('#ent').checked;
    if (!want) return;
    if (sel && !(e.strong_fact === sel || e.weak_fact === sel)) return;
    const A = marksFor(e.strong_fact, e.from)[0], B = marksFor(e.weak_fact, e.to)[0];
    if (!A || !B) return;
    seg.push({A, B, c: e.kind === 'degraded' ? 'var(--deg)' : 'var(--ent)',
              dash: e.kind === 'degraded' ? '' : '4 3', arrow: true});
  });

  const ns = 'http://www.w3.org/2000/svg';
  const defs = document.createElementNS(ns, 'defs');
  defs.innerHTML = `<marker id="ar" viewBox="0 0 8 8" refX="7" refY="4"
    markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L8,4 L0,8 z" fill="context-stroke"/></marker>`;
  wires.append(defs);
  seg.forEach(s => {
    const a = centre(s.A), b = centre(s.B);
    const p = document.createElementNS(ns, 'path');
    const mx = (a.x + b.x) / 2, dy = Math.abs(b.y - a.y);
    p.setAttribute('d', `M${a.x},${a.y} C${mx},${a.y + dy*0.18} ${mx},${b.y - dy*0.18} ${b.x},${b.y}`);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', s.c);
    p.setAttribute('stroke-width', '1.5');
    p.setAttribute('opacity', sel ? '.85' : '.5');
    if (s.dash) p.setAttribute('stroke-dasharray', s.dash);
    if (s.arrow) p.setAttribute('marker-end', 'url(#ar)');
    wires.append(p);
  });
}

document.addEventListener('click', ev => {
  const m = ev.target.closest('mark');
  document.querySelectorAll('mark.on').forEach(x => x.classList.remove('on'));
  if (!m) { sel = null; tip.style.display = 'none'; draw(); return; }
  const fids = m.dataset.fs.split(' ');
  sel = fids[0];
  fids.forEach(f => document.querySelectorAll(`mark[data-fs~="${f}"]`)
    .forEach(x => x.classList.add('on')));
  const rel = cur.entail.filter(e => fids.includes(e.strong_fact) || fids.includes(e.weak_fact));
  let html = `<b>${fids.length} 条事实在此片段</b>`;
  fids.forEach(f => { html += `<div class="num">${esc((cur.facts[f]||{}).c || f)}</div>`; });
  if (rel.length) {
    html += `<div class="row"><b>${rel.length} 条蕴含边</b></div>`;
    rel.slice(0, 6).forEach(e => {
      const tag = e.kind === 'degraded' ? '降级' : '强弱不同';
      html += `<div class="row"><span class="num">${e.from} → ${e.to} · ${tag}`
           +  `${e.same_agent ? ' · 同 agent' : ''} · ${e.margin_strong} / ${e.margin_weak}</span>`
           +  `<div class="s">强 ${esc(e.strong_text)}</div>`
           +  `<div class="w">弱 ${esc(e.weak_text)}</div></div>`;
    });
    if (rel.length > 6) html += `<div class="num">…还有 ${rel.length - 6} 条</div>`;
  } else { html += `<div class="row empty">没有蕴含边</div>`; }
  tip.innerHTML = html;
  tip.style.display = 'block';
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(ev.clientX + 14, innerWidth - r.width - 12) + 'px';
  tip.style.top = Math.min(ev.clientY + 14, innerHeight - r.height - 12) + 'px';
  draw();
});

pick.addEventListener('change', e => render(+e.target.value));
['eq','deg','ent'].forEach(id => $('#' + id).addEventListener('change', draw));
addEventListener('resize', draw);
render(0);
</script>
